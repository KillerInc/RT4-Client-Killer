name: Modern Client

on:
  push:
    branches: [ modern-client ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build client
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :client:clean :client:jar :plugin-playground:classes 2>&1 | tee modern-client-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modern-client-build-log
          path: modern-client-build.log

      - name: Prepare preview and beta packages
        shell: bash
        run: |
          cp client/build/libs/osrs-client-killer-1.0.0-modern.jar osrs-client-killer.jar
          sha256sum osrs-client-killer.jar | awk '{print $1}' > osrs-client-killer.jar.sha256

          cp client/build/libs/osrs-client-killer-1.0.0-modern.jar 2009scape.jar
          sha256sum 2009scape.jar | awk '{print $1}' > 2009scape.jar.sha256
          zip -j 2009scape_beta2.zip 2009scape.jar 2009scape.jar.sha256

          cp client/build/generated/ui-packs/ui/packs/KillerModernUI.uipack KillerModernUI.uipack
          sha256sum KillerModernUI.uipack | awk '{print $1}' > KillerModernUI.uipack.sha256

          cp client/build/distributions/KillerModernUI-Modder-Template.uipack KillerModernUI-Modder-Template.uipack
          sha256sum KillerModernUI-Modder-Template.uipack | awk '{print $1}' > KillerModernUI-Modder-Template.uipack.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: osrs-client-killer
          path: |
            osrs-client-killer.jar
            osrs-client-killer.jar.sha256
            2009scape.jar
            2009scape.jar.sha256
            2009scape_beta2.zip
            KillerModernUI.uipack
            KillerModernUI.uipack.sha256
            KillerModernUI-Modder-Template.uipack
            KillerModernUI-Modder-Template.uipack.sha256

      - name: Publish rolling preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="modern-client-latest"
          notes='Automated preview from modern-client. This remains separate from the current stable RT4 release while the modern baseline is validated.'

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f name="OSRS Client Killer Edition - Modern Client Preview" -f body="$notes" -F prerelease=true -f make_latest=false >/dev/null
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "OSRS Client Killer Edition - Modern Client Preview" --notes "$notes" --prerelease
          fi

          gh release upload "$tag" osrs-client-killer.jar osrs-client-killer.jar.sha256 KillerModernUI.uipack KillerModernUI.uipack.sha256 KillerModernUI-Modder-Template.uipack KillerModernUI-Modder-Template.uipack.sha256 --clobber

      - name: Publish Beta 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="modern-client-beta.2"
          notes=$'BETA BUILD - Beta 2 checkpoint of the modern revision-530 Killer client rebuild.\n\nThis is a beta/testing build while the rebuilt client, UI and compatibility work are being validated.\n\nThe runnable client remains named 2009scape.jar. The version marker is kept on the downloadable archive.'

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f name="BETA - OSRS Client Killer Edition - Beta 2" -f body="$notes" -F prerelease=false -f make_latest=true >/dev/null
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "BETA - OSRS Client Killer Edition - Beta 2" --notes "$notes"
          fi

          gh release upload "$tag" 2009scape.jar 2009scape.jar.sha256 2009scape_beta2.zip KillerModernUI.uipack KillerModernUI.uipack.sha256 KillerModernUI-Modder-Template.uipack KillerModernUI-Modder-Template.uipack.sha256 --clobber
