name: Modern Client

on:
  push:
    branches: [ modern-client ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build client
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :client:clean :client:jar :plugin-playground:classes 2>&1 | tee modern-client-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modern-client-build-log
          path: modern-client-build.log

      - name: Prepare preview and beta packages
        shell: bash
        run: |
          cp client/build/libs/osrs-client-killer-1.0.0-modern.jar osrs-client-killer.jar
          sha256sum osrs-client-killer.jar | awk '{print $1}' > osrs-client-killer.jar.sha256

          cp client/build/libs/osrs-client-killer-1.0.0-modern.jar 2009scape.jar
          sha256sum 2009scape.jar | awk '{print $1}' > 2009scape.jar.sha256
          zip -j 2009scape_beta2.zip 2009scape.jar 2009scape.jar.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: osrs-client-killer
          path: |
            osrs-client-killer.jar
            osrs-client-killer.jar.sha256
            2009scape.jar
            2009scape.jar.sha256
            2009scape_beta2.zip

      - name: Publish rolling preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modern-client-latest
          name: OSRS Client Killer Edition - Modern Client Preview
          prerelease: true
          make_latest: false
          files: |
            osrs-client-killer.jar
            osrs-client-killer.jar.sha256
          body: |
            Automated preview from modern-client. This remains separate from the current stable RT4 release while the modern baseline is validated.

      - name: Publish Beta 2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modern-client-beta.2
          name: BETA - OSRS Client Killer Edition - Beta 2
          prerelease: false
          make_latest: true
          files: |
            2009scape.jar
            2009scape.jar.sha256
            2009scape_beta2.zip
          body: |
            BETA BUILD - Beta 2 checkpoint of the modern revision-530 Killer client rebuild.

            This is a beta/testing build while the rebuilt client, UI and compatibility work are being validated.

            The runnable client remains named 2009scape.jar. The version marker is kept on the downloadable archive.
