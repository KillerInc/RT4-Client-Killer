name: Test Killer UI Rewrite

on:
  push:
    branches:
      - killer-ui-rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Bundle RuneScape vector fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_ZIP="$RUNNER_TEMP/RuneScape-Fonts.zip"
          FONT_DIR="$RUNNER_TEMP/runestar-fonts"
          RESOURCE_DIR="client/src/main/resources/killer-fonts"
          curl -fL "https://github.com/RuneStar/fonts/releases/download/1.103-0/RuneScape-Fonts.zip" -o "$FONT_ZIP"
          mkdir -p "$FONT_DIR" "$RESOURCE_DIR"
          unzip -q "$FONT_ZIP" -d "$FONT_DIR"
          find "$FONT_DIR" -type f -iname 'RuneScape-*.ttf' -exec cp {} "$RESOURCE_DIR/" \;

          for f in \
            RuneScape-Plain-11.ttf \
            RuneScape-Plain-12.ttf \
            RuneScape-Bold-12.ttf \
            RuneScape-Quill-8.ttf \
            RuneScape-Quill.ttf \
            RuneScape-Quill-Caps.ttf \
            RuneScape-Fairy.ttf \
            RuneScape-Fairy-Large.ttf \
            RuneScape-Barbarian-Assault.ttf \
            RuneScape-Surok.ttf
          do
            test -f "$RESOURCE_DIR/$f" || { echo "Missing required RuneStar font: $f"; exit 1; }
          done

      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :client:build

      - name: Upload source audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rt4-source-audit
          path: client/src/main/java

      - name: Stage runtime client
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(ls -1 client/build/libs/client-*.jar | head -1)"
          cp "$JAR" "$RUNNER_TEMP/2009scape.jar"

      - name: Upload runtime client
        uses: actions/upload-artifact@v4
        with:
          name: 2009scape-ui-rewrite
          path: ${{ runner.temp }}/2009scape.jar

      - name: Build versioned 7z test package
        shell: bash
        run: |
          set -euo pipefail
          7z a -t7z -mx=9 "$RUNNER_TEMP/2009scape_v0.5.7z" "$RUNNER_TEMP/2009scape.jar"

      - name: Upload versioned 7z test package
        uses: actions/upload-artifact@v4
        with:
          name: 2009scape_v0.5
          path: ${{ runner.temp }}/2009scape_v0.5.7z

      - name: Build overwrite patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/KillerUIRewrite"
          mkdir -p "$PATCH/client/src/main/java/rt4"
          mkdir -p "$PATCH/client/src/main/java/plugin/api"
          mkdir -p "$PATCH/client/src/main/resources/killer-fonts"

          for f in \
            client.java \
            Component.java \
            InterfaceList.java \
            Cs1ScriptRunner.java \
            ScriptRunner.java \
            MiniMenu.java \
            Fonts.java \
            Font.java \
            KillerUi.java \
            KillerUiLog.java \
            KillerUiText.java \
            MiniMap.java \
            Inv.java \
            Protocol.java \
            LoadingBar.java \
            LoadingBarAwt.java \
            DisplayMode.java \
            WorldMap.java
          do
            cp "client/src/main/java/rt4/$f" "$PATCH/client/src/main/java/rt4/$f"
          done

          cp "client/src/main/java/plugin/api/API.java" "$PATCH/client/src/main/java/plugin/api/API.java"
          cp client/src/main/resources/killer-fonts/*.ttf "$PATCH/client/src/main/resources/killer-fonts/"

          cd "$PATCH"
          zip -qr "$RUNNER_TEMP/KillerUIRewrite_v0.4.zip" client

      - name: Upload overwrite patch
        uses: actions/upload-artifact@v4
        with:
          name: KillerUIRewrite_v0.1
          path: ${{ runner.temp }}/KillerUIRewrite_v0.4.zip
