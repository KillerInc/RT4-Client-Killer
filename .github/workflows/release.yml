name: Build Killer RT4 Client

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Bundle RuneScape vector fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_ZIP="$RUNNER_TEMP/RuneScape-Fonts.zip"
          FONT_DIR="$RUNNER_TEMP/runestar-fonts"
          RESOURCE_DIR="client/src/main/resources/killer-fonts"

          curl -fL "https://github.com/RuneStar/fonts/releases/download/1.103-0/RuneScape-Fonts.zip" -o "$FONT_ZIP"
          mkdir -p "$FONT_DIR" "$RESOURCE_DIR"
          unzip -q "$FONT_ZIP" -d "$FONT_DIR"

          P11="$(find "$FONT_DIR" -type f -iname 'RuneScape-Plain-11.ttf' | head -1)"
          P12="$(find "$FONT_DIR" -type f -iname 'RuneScape-Plain-12.ttf' | head -1)"
          B12="$(find "$FONT_DIR" -type f -iname 'RuneScape-Bold-12.ttf' | head -1)"

          test -n "$P11" && test -s "$P11"
          test -n "$P12" && test -s "$P12"
          test -n "$B12" && test -s "$B12"

          cp "$P11" "$RESOURCE_DIR/RuneScape-Plain-11.ttf"
          cp "$P12" "$RESOURCE_DIR/RuneScape-Plain-12.ttf"
          cp "$B12" "$RESOURCE_DIR/RuneScape-Bold-12.ttf"

      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :client:build
          JAR="$(ls -1 client/build/libs/client-*.jar | head -1)"
          cp "$JAR" client/build/libs/rt4-client-killer.jar
          sha256sum client/build/libs/rt4-client-killer.jar | awk '{print $1}' > client/build/libs/rt4-client-killer.jar.sha256

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < KILLER_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=client-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt4-client-killer
          path: |
            client/build/libs/rt4-client-killer.jar
            client/build/libs/rt4-client-killer.jar.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          JAR=client/build/libs/rt4-client-killer.jar
          SHA=client/build/libs/rt4-client-killer.jar.sha256
          NOTES="Killer RT4 Client v$VERSION\n\n- Uses RuneScape TTF fonts through dedicated direct-TTF software/OpenGL renderers.\n- Keeps stock RT4 SoftwareFont and GlFont unchanged.\n- Retains RT4 text parsing/effects for colors, shadows, transparency and animated text positioning.\n- TTF metrics and kerning are generated directly at native size x Font Scale.\n- UI scaling remains independent and unchanged.\n- Logs direct-TTF load/render/fallback details to logs/killer-font.log."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SHA" --clobber
            gh release edit "$TAG" --title "Killer RT4 Client v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" "$SHA" --target "$GITHUB_SHA" --title "Killer RT4 Client v$VERSION" --notes "$NOTES"
          fi
