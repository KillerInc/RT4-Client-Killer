name: Build Killer RT4 Client

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :client:build
          JAR="$(ls -1 client/build/libs/client-*.jar | head -1)"
          cp "$JAR" client/build/libs/rt4-client-killer.jar
          sha256sum client/build/libs/rt4-client-killer.jar | awk '{print $1}' > client/build/libs/rt4-client-killer.jar.sha256

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < KILLER_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=client-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt4-client-killer
          path: |
            client/build/libs/rt4-client-killer.jar
            client/build/libs/rt4-client-killer.jar.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          JAR=client/build/libs/rt4-client-killer.jar
          SHA=client/build/libs/rt4-client-killer.jar.sha256
          NOTES="Killer RT4 Client v$VERSION\n\n- Based on the current 2009Scape RT4 client.\n- Restores the original 2009Scape font and rendering path.\n- Removes the experimental text/vector-font scaling changes.\n- UI scaling is left to the original client/launcher behavior."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SHA" --clobber
            gh release edit "$TAG" --title "Killer RT4 Client v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" "$SHA" --target "$GITHUB_SHA" --title "Killer RT4 Client v$VERSION" --notes "$NOTES"
          fi
