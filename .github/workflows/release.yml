name: Build Killer RT4 Client

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Bundle RuneScape vector fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_ZIP="$RUNNER_TEMP/RuneScape-Fonts.zip"
          FONT_DIR="$RUNNER_TEMP/runestar-fonts"
          RESOURCE_DIR="client/src/main/resources/killer-fonts"

          curl -fL "https://github.com/RuneStar/fonts/releases/download/1.103-0/RuneScape-Fonts.zip" -o "$FONT_ZIP"
          mkdir -p "$FONT_DIR" "$RESOURCE_DIR"
          unzip -q "$FONT_ZIP" -d "$FONT_DIR"

          find "$FONT_DIR" -type f -iname 'RuneScape-*.ttf' -exec cp {} "$RESOURCE_DIR/" \;

          for f in \
            RuneScape-Plain-11.ttf \
            RuneScape-Plain-12.ttf \
            RuneScape-Bold-12.ttf \
            RuneScape-Quill-8.ttf \
            RuneScape-Quill.ttf \
            RuneScape-Quill-Caps.ttf \
            RuneScape-Fairy.ttf \
            RuneScape-Fairy-Large.ttf \
            RuneScape-Barbarian-Assault.ttf \
            RuneScape-Surok.ttf
          do
            test -f "$RESOURCE_DIR/$f" || { echo "Missing required RuneStar font: $f"; exit 1; }
          done

      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :client:build
          JAR="$(ls -1 client/build/libs/client-*.jar | head -1)"
          cp "$JAR" client/build/libs/rt4-client-killer.jar
          sha256sum client/build/libs/rt4-client-killer.jar | awk '{print $1}' > client/build/libs/rt4-client-killer.jar.sha256

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < KILLER_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=client-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt4-client-killer
          path: |
            client/build/libs/rt4-client-killer.jar
            client/build/libs/rt4-client-killer.jar.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          JAR=client/build/libs/rt4-client-killer.jar
          SHA=client/build/libs/rt4-client-killer.jar.sha256
          NOTES="Killer RT4 Client v$VERSION\n\n- Routes visible UI and world-overlay text through the Killer TTF renderer.\n- Preserves the validated 1.0 font baseline while allowing independent Font Scale.\n- UI Scale controls interface geometry and also scales text with the UI.\n- Font Scale changes text only; effective text size is UI Scale x Font Scale.\n- Scales tiled panel artwork, decorative/inventory sprites, and scrollbar arrows with UI Scale while preserving the 1.0 render path.\n- Normal mouse-over/action tooltip text remains static; explicit wave/wave2/shake effects are preserved.\n- Bundles all required RuneScape TTF families and logs UI/font/effective scale diagnostics to logs/killer-ui.log."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SHA" --clobber
            gh release edit "$TAG" --title "Killer RT4 Client v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" "$SHA" --target "$GITHUB_SHA" --title "Killer RT4 Client v$VERSION" --notes "$NOTES"
          fi
