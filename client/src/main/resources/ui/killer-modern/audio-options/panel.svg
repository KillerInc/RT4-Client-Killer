<svg xmlns="http://www.w3.org/2000/svg" width="420" height="374" viewBox="0 0 420 374">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3022" stop-opacity=".97"/>
      <stop offset=".5" stop-color="#2e251b" stop-opacity=".96"/>
      <stop offset="1" stop-color="#231c15" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2a366"/>
      <stop offset=".48" stop-color="#765f3d"/>
      <stop offset="1" stop-color="#d0b476"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
