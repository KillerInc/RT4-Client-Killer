plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

application {
    mainClass = 'rt4.client'
}

version = '1.0.0-modern'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

dependencies {
    compileOnly project(':deob-annotations')
    implementation project(':signlink')
    // Keep the original RT4 JOGL/GlueGen stack. The HD renderer was written
    // against these exact binaries and their native packaging.
    implementation 'lib:gson'
    implementation 'lib:gluegen-rt'
    implementation 'lib:gluegen-rt-natives-windows-amd64'
    implementation 'lib:gluegen-rt-natives-windows-i586'
    implementation 'lib:gluegen-rt-natives-linux-amd64'
    implementation 'lib:gluegen-rt-natives-linux-i586'
    implementation 'lib:gluegen-rt-natives-macosx-universal'
    implementation 'lib:gluegen-rt-natives-android-aarch64'
    implementation 'lib:gluegen-rt-natives-linux-aarch64'

    implementation 'lib:jogl-all'
    implementation 'lib:jogl-all-natives-linux-aarch64'
    implementation 'lib:jogl-all-natives-windows-amd64'
    implementation 'lib:jogl-all-natives-windows-i586'
    implementation 'lib:jogl-all-natives-linux-amd64'
    implementation 'lib:jogl-all-natives-linux-i586'
    implementation 'lib:jogl-all-natives-macosx-universal'
    implementation 'lib:jogl-all-natives-android-aarch64'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'

    // Vector UI artwork for scalable Modern UI style packs.
    implementation 'org.apache.xmlgraphics:batik-transcoder:1.19'
}

def generatedUiPacksRoot = layout.buildDirectory.dir('generated/ui-packs')
def generatedUiPacksDirectory = generatedUiPacksRoot.map { it.dir('ui/packs') }

tasks.register('buildKillerModernUiPack', Zip) {
    group = 'distribution'
    description = 'Builds the authoritative Killer Modern UI archive.'
    archiveFileName = 'KillerModernUI.uipack'
    destinationDirectory = generatedUiPacksDirectory
    from('src/main/resources/ui/killer-modern')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('buildModernUiModderTemplate', Zip) {
    group = 'distribution'
    description = 'Builds the starter Modern UI modder archive.'
    archiveFileName = 'KillerModernUI-Modder-Template.uipack'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/ui-packs/modder-template')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets {
    main {
        resources {
            srcDir(generatedUiPacksRoot)
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('buildKillerModernUiPack')
}

tasks.named('jar') {
    dependsOn(configurations.runtimeClasspath)
    dependsOn(tasks.named('buildModernUiModderTemplate'))
    archiveBaseName = 'osrs-client-killer'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}


tasks.register('verifyModernSvgAssets', JavaExec) {
    group = 'verification'
    description = 'Rasterizes representative Modern UI SVG assets through the live Batik renderer.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rt4.ModernSvgAssetVerifier'
    args '/ui/killer-modern/main-menu/scroll.svg',
        '/ui/killer-modern/main-menu/logo.svg',
        '/ui/killer-modern/audio-options/panel.svg',
        '/ui/killer-modern/audio-options/slider-track.svg',
        '/ui/killer-modern/audio-options/toggle-on.svg',
        '/ui/killer-modern/controls/popup-divider.svg',
        '/ui/killer-modern/controls/popup-row.svg'
}
