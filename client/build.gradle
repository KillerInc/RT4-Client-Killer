plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

application {
    mainClass = 'rt4.client'
}

version = '1.0.0-modern'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

dependencies {
    compileOnly project(':deob-annotations')
    implementation project(':signlink')
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.jogamp.gluegen:gluegen-rt-main:2.6.0'
    implementation 'org.jogamp.jogl:jogl-all-main:2.6.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
}

tasks.named('jar') {
    dependsOn(configurations.runtimeClasspath)
    archiveBaseName = 'osrs-client-killer'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
