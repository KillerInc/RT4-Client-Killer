plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation project(':client')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
}

test {
    useJUnitPlatform()
}

/*
 * The modern client loads external plugins from JAR files.
 * Existing playground sources remain useful while plugins are migrated.
 * Production plugins should be packaged individually with
 * META-INF/killer-plugin.properties.
 */
